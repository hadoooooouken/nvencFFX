[package]
name = "nvencffx"
version = "2.0.0"
edition = "2024"
authors = ["hadoukez"]
description = "GUI for FFmpeg with NVIDIA NVENC hardware acceleration"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
