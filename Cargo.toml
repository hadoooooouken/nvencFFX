[package]
name = "nvencffx"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["hadoukez"]
description = "GUI for FFmpeg with NVIDIA NVENC hardware acceleration"
license = "MIT"
publish = false

[dependencies]
arboard = { version = "3.6", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features", "default_fonts"] }
egui = "0.36"
# Only the Windows backends: eframe's `wgpu` feature also compiles in GLES (ANGLE / EGL),
# Metal and the web backends. DX12 includes the WARP software adapter as the last resort.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
