[package]
name = "nvencffx"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["hadoukez"]
description = "GUI for FFmpeg with NVIDIA NVENC hardware acceleration"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
